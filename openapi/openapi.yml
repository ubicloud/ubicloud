                  type: string
                  example: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGkT3pVfM0a9ZsYbq7Qd1xWnRj5LcUe8HvBtKo2PyDmA user@my-laptop
                  writeOnly: true
                size:
                  description: Size of the VM
                  type: string
                  default: standard-2
                storage_size:
                  description: Requested size of each storage volume in GiB
                  type: integer
                gpu:
                  description: Deprecated; send gpu_count and gpu_device, which take precedence. Requested GPU count and device, as "count:device".
                  type: string
                  deprecated: true
                  x-deprecated:
                    since: 2026-11-02
                    removed-in: 2
                    use:
                      - gpu_count
                      - gpu_device
                gpu_count:
                  description: Number of GPUs
                  type: integer
                  minimum: 0
                gpu_device:
                  description: PCI device ID of the GPUs, such as 20b5; requires gpu_count
                  type: string
                unix_user:
                  description: Unix user of the VM
                  type: string
                  default: ubi
              additionalProperties: false
              required:
