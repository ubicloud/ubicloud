        type: string
        example: environment:production,team:backend
    vm_reference:
      description: Virtual machine ID or name
      examples:
        id:
          value: vmn30gjk1d1e2jj34v9x0dq4rp
        name:
          value: virtual-machine-name
      in: path
      name: vm_reference
      required: true
      schema:
        $ref: '#/components/schemas/Reference'
  schemas:
    MaintenanceWindowDay:
      type: string
      enum:
        - mon
        - tue
        - wed
        - thu
        - fri
        - sat
        - sun
    Kubeconfig:
      description: Raw YAML content of a Kubernetes cluster configuration file
      type: string
    AuditLog:
      type: object
      properties:
        at:
          description: Timestamp of the action
          type: string
          format: date-time
        action:
          description: Action performed
          type: string
        subject_id:
          description: ID of the account that performed the action
          type: string
        subject_name:
          description: Name of the account that performed the action (if still member of project)
          type: string
        object_ids:
          description: IDs of the objects affected by the action
          type: array
          items:
            type: string
      additionalProperties: false
      required:
        - at
        - action
        - subject_id
        - object_ids
    Error:
      type: object
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: integer
              example: 401
            message:
              type: string
              example: There was an error logging in
            type:
              type: string
              example: InvalidCredentials
            details:
              type: object
              nullable: true
          required:
            - code
            - message
            - type
      additionalProperties: false
      required:
        - error
    PostgresConfig:
      type: object
      properties:
        pg_config:
          description: PostgreSQL parameters set by the user
          type: object
          example:
            max_connections: '100'
          additionalProperties:
            type: string
        pgbouncer_config:
          description: PgBouncer parameters set by the user
          type: object
          example:
            max_client_conn: '100'
          additionalProperties:
            type: string
        default_pg_config:
          description: System-computed configuration values based on instance size. User overrides in pg_config take precedence.
          type: object
          additionalProperties:
            type: string
          nullable: true
          readOnly: true
        message:
          description: Informational message about the configuration update, such as restart requirements.
          type: string
          readOnly: true
      additionalProperties: false
      required:
        - pg_config
        - pgbouncer_config
    SshPublicKeyCreate:
      type: object
      properties:
        name:
          description: Name of the SSH public key
          type: string
          example: my-laptop
        public_key:
          description: One or more SSH public keys, one per line, in the format of an authorized_keys file
          type: string
          example: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGkT3pVfM0a9ZsYbq7Qd1xWnRj5LcUe8HvBtKo2PyDmA user@my-laptop
      additionalProperties: false
      required:
        - name
        - public_key
    CertAuthUserRequest:
      type: object
      properties:
        name:
          description: name of user
          type: string
      additionalProperties: false
      required:
        - name
    CertAuthUserList:
      type: object
      properties:
        items:
          type: array
          items:
            type: string
      additionalProperties: false
      required:
        - items
    PostgresTag:
      type: object
      properties:
        key:
          description: Key of the Postgres tag
          type: string
        value:
          description: Value of the Postgres tag
          type: string
      additionalProperties: false
      required:
        - key
        - value
    PrivateLocation:
      type: object
      properties:
        id:
          description: ID of the private location
          type: string
        name:
          description: Name of the private location
          type: string
        ui_name:
          description: UI name of the private location
          type: string
        provider:
          description: Cloud provider of the private location
          type: string
        path:
          description: Path of the private location
          type: string
      additionalProperties: false
      required:
        - id
        - name
        - provider
        - path
        - ui_name
    GithubCacheEntry:
      type: object
      properties:
        installation_name:
          description: name of the GitHub installation containing the repository containing the cache entry
          type: string
        repository_name:
          description: name of the GitHub repository containing the cache entry
          type: string
        id:
          description: ID of the GitHub cache entry
          type: string
          example: gefg7td83em22qfw9pq5xyfqb7
          pattern: ^ge[0-9a-hj-km-np-tv-z]{24}$
        key:
          description: GitHub cache entry key
          type: string
        scope:
          description: Branch scope of the GitHub cache entry
          type: string
        size:
          description: Size of the GitHub cache entry in bytes
          type: integer
          nullable: true
        created_at:
          description: Timestamp of when the cache entry was created
          type: string
          format: date-time
        last_accessed_at:
          description: Timestamp of when the cache entry was last accessed
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
      required:
        - id
        - installation_name
        - repository_name
        - key
        - scope
        - size
        - created_at
        - last_accessed_at
    GithubRepository:
      type: object
      properties:
        installation_name:
          description: Name of the GitHub installation containing the repository
          type: string
        id:
          description: ID of the GitHub repository
          type: string
          example: gpfg7td83em22qfw9pq5xyfqb7
          pattern: ^gp[0-9a-hj-km-np-tv-z]{24}$
        name:
          description: Name of the GitHub repository
          type: string
      additionalProperties: false
      required:
        - id
        - installation_name
        - name
    GithubInstallation:
      type: object
      properties:
        id:
          description: ID of the GitHub installation
          type: string
          example: g1fg7td83em22qfw9pq5xyfqb7
          pattern: ^g1[0-9a-hj-km-np-tv-z]{24}$
        name:
          description: Name of the GitHub installation (GitHub user/organization name)
          type: string
      additionalProperties: false
      required:
        - id
        - name
    Firewall:
      type: object
      properties:
        description:
          description: Description of the firewall
          type: string
        firewall_rules:
          description: List of firewall rules
          type: array
          items:
            $ref: '#/components/schemas/FirewallRule'
          readOnly: true
        id:
          description: ID of the firewall
          type: string
          example: fwfg7td83em22qfw9pq5xyfqb7
          pattern: ^fw[0-9a-hj-km-np-tv-z]{24}$
          readOnly: true
        location:
          description: Location of the firewall
          type: string
          readOnly: true
        name:
          description: Name of the firewall
          type: string
        path:
          description: Path of the firewall, relative to the project
          type: string
          example: /location/eu-central-h1/firewall/my-firewall
          readOnly: true
      additionalProperties: false
      required:
        - description
        - firewall_rules
        - id
        - location
        - name
        - path
    FirewallRule:
      type: object
      properties:
        cidr:
          description: CIDR of the firewall rule
          type: string
          format: cidr
        id:
          description: ID of the firewall rule
          type: string
          example: fraz0q3vbrpa7pkg7zbmah9csn
          pattern: ^fr[0-9a-hj-km-np-tv-z]{24}$
          readOnly: true
        port_range:
          description: Port or port range of the firewall rule, such as 443 or 8000..8080
          type: string
          format: port-range
        protocol:
          description: Protocol of the firewall rule (tcp or udp)
          type: string
          enum:
            - tcp
            - udp
        description:
          description: Description of the firewall rule
          type: string
      additionalProperties: false
      required:
        - cidr
        - id
        - port_range
        - protocol
        - description
    SshPublicKey:
      type: object
      properties:
        id:
          description: ID of the SSH public key
          type: string
          example: skaz0q3vbrpa7pkg7zbmah9csn
          pattern: ^sk[0-9a-hj-km-np-tv-z]{24}$
          readOnly: true
        name:
          description: Name of the SSH public key
          type: string
        public_key:
          description: SSH public key data
          type: string
      additionalProperties: false
      required:
        - id
        - name
    InferenceApiKey:
      type: object
      properties:
        id:
          description: ID of the inference API key
          type: string
          example: akaz0q3vbrpa7pkg7zbmah9csn
          pattern: ^ak[0-9a-hj-km-np-tv-z]{24}$
          readOnly: true
        key:
          description: Secret that authenticates requests to the inference endpoints
          type: string
          format: password
          readOnly: true
          x-immutable: true
      additionalProperties: false
      required:
        - id
        - key
    InferenceEndpointPrice:
      type: object
      properties:
        per_million_prompt_tokens:
          description: Price per million prompt tokens in USD
          type: number
          nullable: true
        per_million_completion_tokens:
          description: Price per million completion tokens in USD
          type: number
          nullable: true
      additionalProperties: false
      required:
        - per_million_prompt_tokens
        - per_million_completion_tokens
    InferenceEndpoint:
      type: object
      properties:
        id:
          description: ID of the inference endpoint
          type: string
        name:
          description: Name of the model
          type: string
        display_name:
          description: Display name of the model
          type: string
        url:
          description: URL of the inference endpoint
          type: string
        model_name:
          description: Model name of the inference endpoint
          type: string
        tags:
          description: Tags of the inference endpoint
          type: object
        price:
          $ref: '#/components/schemas/InferenceEndpointPrice'
      additionalProperties: false
      required:
        - id
        - name
        - display_name
        - url
        - model_name
        - tags
        - price
    LoadBalancer:
      type: object
      properties:
        algorithm:
          description: Algorithm of the Load Balancer
          type: string
          enum:
            - round_robin
            - hash_based
        stack:
          description: Networking stack of the Load Balancer
          type: string
          enum:
            - ipv4
            - ipv6
            - dual
        dst_port:
          description: Destination port for the Load Balancer
