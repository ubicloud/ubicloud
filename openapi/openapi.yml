    PostgresDatabase:
      description: A Postgres Database
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            allOf:
              - $ref: '#/components/schemas/PostgresDatabase'
              - type: object
                additionalProperties: false
                properties:
                  connection_string:
                    description: Connection string to the Postgres database. It contains the superuser password.
                    type: string
                    format: password
                    nullable: true
                    readOnly: true
                  private_connection_string:
                    description: Private connection string to the Postgres database, accessible from connected subnets. It contains the superuser password.
                    type: string
                    format: password
                    nullable: true
                    readOnly: true
                  username:
                    description: Username for the Postgres database
                    type: string
                    nullable: true
                    readOnly: true
                  password:
                    description: Password for the Postgres database
                    type: string
                    format: password
                    nullable: true
                  hostname:
                    description: Hostname for the Postgres database
                    type: string
                    nullable: true
                    readOnly: true
                  earliest_restore_time:
                    description: Earliest restore time (if primary), or null if there is no backup yet
                    type: string
                    format: date-time
                    nullable: true
                    readOnly: true
                  firewall_rules:
                    description: List of Postgres firewall rules
                    type: array
                    items:
                      $ref: '#/components/schemas/PostgresFirewallRule'
                    readOnly: true
                  private_subnet_id:
                    description: ID of the database's private subnet
                    type: string
                    example: pskkmx0f2vke4h36nk9cm8v8q0
                    pattern: ^ps[0-9a-hj-km-np-tv-z]{24}$
                    readOnly: true
                    x-immutable: true
                  firewall_id:
                    description: ID of the firewall that holds the database's firewall rules, or null if it was deleted, renamed, or detached from the private subnet
                    type: string
                    example: fwfg7td83em22qfw9pq5xyfqb7
                    nullable: true
                    pattern: ^fw[0-9a-hj-km-np-tv-z]{24}$
                    readOnly: true
                  latest_restore_time:
                    description: Deprecated. Latest restore time (if primary), which is always the current time.
                    type: string
                    deprecated: true
                    x-deprecated:
                      since: 2026-11-02
                  primary:
                    description: Is the database primary
                    type: boolean
                    readOnly: true
                  metric_destinations:
                    description: List of metric destinations
                    type: array
                    items:
                      $ref: '#/components/schemas/PostgresMetricDestination'
                    readOnly: true
                  log_destinations:
                    description: List of log destinations
                    type: array
                    items:
                      $ref: '#/components/schemas/PostgresLogDestination'
                    readOnly: true
                  pg_config:
                    description: PostgreSQL parameters set by the user
                    type: object
                    example:
                      max_connections: '100'
                    additionalProperties:
                      type: string
                  pgbouncer_config:
                    description: PgBouncer parameters set by the user
                    type: object
                    example:
                      max_client_conn: '100'
                    additionalProperties:
                      type: string
                  read_replicas:
                    description: List of read replicas of the Postgres database
                    type: array
                    items:
                      $ref: '#/components/schemas/PostgresDatabase'
                    readOnly: true
                required:
                  - connection_string
                  - private_connection_string
                  - username
                  - password
                  - hostname
                  - firewall_rules
                  - private_subnet_id
                  - firewall_id
                  - primary
                  - metric_destinations
                  - log_destinations
                  - pg_config
                  - pgbouncer_config
                  - read_replicas
    PostgresDatabases:
      description: A list of Postgres Databases
      content:
        application/json:
