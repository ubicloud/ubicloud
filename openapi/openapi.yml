    PostgresDatabaseUpgradeStatus:
      description: A Postgres Database Upgrade Status
      content:
        application/json:
          schema:
            type: object
            properties:
              current_version:
                description: Major PostgreSQL version the database runs
                type: string
                enum:
                  - '16'
                  - '17'
                  - '18'
                readOnly: true
              target_version:
                description: Major PostgreSQL version that the servers converge to
                type: string
                enum:
                  - '16'
                  - '17'
                  - '18'
              upgrade_status:
                description: running while the database moves to target_version, failed if the upgrade failed, and not_running when no upgrade is under way
                type: string
                readOnly: true
              upgrade_stage:
                description: Current step of the servers' convergence, or null if they are not converging
                type: string
                nullable: true
                readOnly: true
            additionalProperties: false
            required:
              - current_version
              - target_version
              - upgrade_status
