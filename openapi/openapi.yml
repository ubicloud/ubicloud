      schema:
        type: string
        example: akkkmx0f2vke4h36nk9cm8v8q0
        pattern: ^ak[0-9a-hj-km-np-tv-z]{24}$
    kubernetes_cluster_new_name:
      description: Name for a new kubernetes cluster, of at most 37 characters, since the default nodepool that worker_size asks for is named after the cluster with "-np" appended, and a nodepool's name may have at most 40
      example: my-cluster
      in: path
      name: kubernetes_cluster_reference
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9](?:[a-z0-9\-]{0,35}[a-z0-9])?$
    kubernetes_cluster_reference:
      description: Kubernetes cluster ID or name
      examples:
        id:
          value: kcn30gjk1d1e2jj34v9x0dq4rp
        name:
          value: kubernetes-cluster-name
      in: path
      name: kubernetes_cluster_reference
      required: true
      schema:
        $ref: '#/components/schemas/Reference'
    kubernetes_node_name:
      description: Kubernetes node name
      example: kubernetes-node-name
      in: path
      name: kubernetes_node_name
      required: true
      schema:
        $ref: '#/components/schemas/Reference'
    kubernetes_nodepool_reference:
      description: Kubernetes nodepool ID or name
      examples:
        id:
          value: kn66ktqjab025mkxhjmavpwjxs
        name:
          value: kubernetes-nodepool-name
      in: path
      name: kubernetes_nodepool_reference
      required: true
      schema:
        $ref: '#/components/schemas/Reference'
    load_balancer_reference:
      description: Load balancer ID or name
      examples:
        id:
          value: 1bn30gjk1d1e2jj34v9x0dq4rp
        name:
          value: load-balancer-name
      in: path
      name: load_balancer_reference
      required: true
      schema:
        $ref: '#/components/schemas/Reference'
    location:
      description: The Ubicloud location/region
      in: path
      name: location
      required: true
      schema:
        type: string
        example: eu-central-h1
    log_destination_id:
      description: Postgres Log Destination ID
      in: path
      name: log_destination_id
      required: true
      schema:
        type: string
        example: 1d000000000000000000000000
        pattern: ^1d[0-9a-hj-km-np-tv-z]{24}$
    machine_image_new_name:
