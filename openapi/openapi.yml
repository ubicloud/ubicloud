  /project/{project_id}/location/{location}/postgres/{postgres_database_reference}/log-destination:
    parameters:
      - $ref: '#/components/parameters/location'
      - $ref: '#/components/parameters/postgres_database_reference'
      - $ref: '#/components/parameters/project_id'
    post:
      operationId: createLocationPostgresLogDestination
      summary: Create a new PostgreSQL log destination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: Name for the Log Destination
                  type: string
                  example: graylog
                type:
                  description: Destination type. "otlp" sends via OTLP HTTP (https://...); "syslog" sends via RFC 5424 over TLS (tcp://host:port)
                  type: string
                  example: syslog
                  enum:
                    - otlp
                    - syslog
                url:
                  description: 'Endpoint URL. For otlp: https://... For syslog: tcp://host:port'
                  type: string
                  example: tcp://logs.example.com:6514
                options:
                  description: Authentication options, which are never returned. An otlp destination takes only headers, and a syslog destination only structured_data.
                  type: object
                  format: password
                  additionalProperties: false
                  properties:
                    headers:
                      description: HTTP headers to send with each OTLP request, as a map from name to value
                      type: object
                      example:
                        api-key: my-license-key
                      additionalProperties:
                        type: string
                    structured_data:
                      description: RFC 5424 structured data to send with each message, as a map from each SD-ID to its parameters
                      type: object
                      example:
                        token@41058:
                          tag: my-token
                      additionalProperties:
                        type: object
                        additionalProperties:
                          type: string
                  writeOnly: true
              additionalProperties: false
              required:
                - name
                - type
                - url
      responses:
        '200':
          $ref: '#/components/responses/PostgresLogDestination'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Postgres Log Destination
  /project/{project_id}/location/{location}/postgres/{postgres_database_reference}/log-destination/{log_destination_id}:
    parameters:
      - $ref: '#/components/parameters/location'
      - $ref: '#/components/parameters/log_destination_id'
      - $ref: '#/components/parameters/postgres_database_reference'
      - $ref: '#/components/parameters/project_id'
    delete:
      operationId: deleteLocationPostgresLogDestination
      summary: Delete a specific log destination
      responses:
        '204':
          $ref: '#/components/responses/Delete'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Postgres Log Destination
    get:
      operationId: getLocationPostgresLogDestination
      summary: Get a PostgreSQL log destination
      responses:
        '200':
          $ref: '#/components/responses/PostgresLogDestination'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Postgres Log Destination
  /project/{project_id}/location/{location}/postgres/{postgres_database_reference}/logs:
    parameters:
      - $ref: '#/components/parameters/location'
      - $ref: '#/components/parameters/postgres_database_reference'
      - $ref: '#/components/parameters/project_id'
    get:
      operationId: getPostgresDatabaseLogs
      summary: Get PostgreSQL database logs
      parameters:
        - name: start
          in: query
          description: Start time for log query (rfc3339 format, default 30 minutes ago)
          required: false
          schema:
            type: string
            example: 2025-05-12T11:27:24+00:00
        - name: end
          in: query
          description: End time for log query (rfc3339 format, default now)
          required: false
          schema:
            type: string
            example: 2025-05-12T11:57:24+00:00
        - name: stream_name
          in: query
          description: Filter by log stream (postgres, pgbouncer, or upgrade)
          required: false
          schema:
            type: string
            example: postgres
            enum:
              - postgres
              - pgbouncer
              - upgrade
        - name: severity_level
          in: query
          description: Filter by log severity level
          required: false
          schema:
            type: string
            example: INFO
            enum:
              - DEBUG
              - INFO
              - WARN
              - ERROR
              - FATAL
        - name: server_role
          in: query
          description: Filter by server role (primary or standby)
          required: false
          schema:
            type: string
            example: primary
            enum:
              - primary
              - standby
        - name: query_pattern
          in: query
          description: Pattern for substring match against log message body
          required: false
          schema:
            type: string
        - name: max_log_lines
          in: query
          description: Number of log lines to return (default 50, max 500)
          required: false
          schema:
            type: integer
            default: 50
        - name: pagination_key
          in: query
          description: Pagination key returned from a previous response
          required: false
          schema:
            type: string
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      responses:
        '200':
          $ref: '#/components/responses/PostgresDatabaseLogs'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Postgres Database
  /project/{project_id}/location/{location}/postgres/{postgres_database_reference}/metric-destination:
    parameters:
      - $ref: '#/components/parameters/location'
      - $ref: '#/components/parameters/postgres_database_reference'
      - $ref: '#/components/parameters/project_id'
    post:
      operationId: createLocationPostgresMetricDestination
      summary: Create a new PostgreSQL metric destination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                options:
                  description: Additional Prometheus remote_write authentication, which is never returned. Without username and password, it must give authorization or at least one header.
                  type: object
                  format: password
                  additionalProperties: false
                  nullable: true
                  properties:
                    authorization:
                      description: Scheme and credentials for the Authorization header. It cannot be combined with username and password.
                      type: object
                      additionalProperties: false
                      properties:
                        type:
                          description: Authentication scheme, which is Bearer when omitted and cannot be Basic
                          type: string
                          minLength: 1
                        credentials:
                          description: Credentials sent after the scheme, such as a bearer token
                          type: string
                          minLength: 1
                      required:
                        - credentials
                    headers:
                      description: HTTP headers to send with each remote_write request, as a map from name to value. Authorization and the other headers that Prometheus reserves cannot be set.
                      type: object
                      example:
                        X-Scope-OrgID: tenant1
                      additionalProperties:
                        type: string
                  writeOnly: true
                password:
                  description: Password for basic auth. It is required with username, and never returned.
                  type: string
                  format: password
                  nullable: true
                  writeOnly: true
                url:
                  description: URL for the Metric Destination
                  type: string
                  example: https://prometheus.example.com/api/v1/write
                username:
                  description: Username for basic auth, required with password
                  type: string
                  nullable: true
              additionalProperties: false
              required:
                - url
      responses:
        '200':
          $ref: '#/components/responses/PostgresMetricDestination'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Postgres Metric Destination
