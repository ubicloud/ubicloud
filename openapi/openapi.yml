openapi: 3.0.3
info:
  description: |-
    API for managing resources on Ubicloud

    To use version 2 of the API, send `Accept: application/vnd.ubicloud+json; version=2`. A request that does not name that media type gets version 1. Each version refuses a deprecated operation or request property whose `x-deprecated` sets `removed-in` to that version or an earlier one. It accepts one removed in a later version, but reports its use in the `Deprecation` and `Warning` response headers, and may refuse a share of the requests that use it. Responses are the same in both versions.
  title: Clover API
  version: 0.1.0
  x-api-version: 2
  contact:
    url: https://www.ubicloud.com/
    email: support@ubicloud.com
  license:
    name: GNU Affero General Public License v3.0 (AGPL-3.0)
    url: https://www.gnu.org/licenses/agpl-3.0.en.html
servers:
  - url: https://api.ubicloud.com
paths:
  /project/{project_id}:
    parameters:
      - $ref: '#/components/parameters/project_id'
    delete:
      operationId: deleteProject
      summary: Delete a project
      responses:
        '204':
          $ref: '#/components/responses/Delete'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Project
    get:
      operationId: getProject
      summary: Retrieve a project
      responses:
        '200':
          $ref: '#/components/responses/Project'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Project
  /project/{project_id}/audit-log:
    parameters:
      - $ref: '#/components/parameters/project_id'
    get:
      operationId: searchProjectAuditLog
      summary: Search project audit log entries
      parameters:
        - name: action
          in: query
          description: Filter by action type
          required: false
          schema:
            type: string
          example: vm, create, vm/create
        - name: end
          in: query
          description: Filter by end_date (shows 3 months prior)
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: Limit the number of returned records (1-1000)
          required: false
          schema:
            type: number
        - name: subject
          in: query
          description: Filter by account name/email/ID
          required: false
          schema:
            type: string
        - name: object
          in: query
          description: Filter by object ID
          required: false
          schema:
            type: string
        - name: pagination_key
          in: query
          description: Key for paginating results
          required: false
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/AuditLogs'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Audit Log
  /project/{project_id}/firewall:
    parameters:
      - $ref: '#/components/parameters/project_id'
    get:
      operationId: getFirewall
      summary: List all firewalls
      responses:
        '200':
          $ref: '#/components/responses/Firewalls'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Firewall
  /project/{project_id}/github:
    parameters:
      - $ref: '#/components/parameters/project_id'
    get:
      operationId: getGithubInstallations
      summary: List all GitHub installations
      responses:
        '200':
          $ref: '#/components/responses/GithubInstallations'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - GitHub
  /project/{project_id}/github/{github_installation_reference}:
    parameters:
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/github_installation_reference'
    get:
      operationId: getGithubInstallation
      summary: Get GitHub installation details
      responses:
        '200':
          $ref: '#/components/responses/GithubInstallation'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - GitHub
  /project/{project_id}/github/{github_installation_reference}/repository:
    parameters:
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/github_installation_reference'
    get:
      operationId: getGithubInstallationRepositories
      summary: List repositories for a GitHub installation
      responses:
        '200':
          $ref: '#/components/responses/GithubRepositories'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - GitHub
  /project/{project_id}/github/{github_installation_reference}/repository/{github_repository_reference}:
    parameters:
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/github_installation_reference'
      - $ref: '#/components/parameters/github_repository_reference'
    get:
      operationId: getGithubRepository
      summary: Get GitHub repository details
      responses:
        '200':
          $ref: '#/components/responses/GithubRepository'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - GitHub
  /project/{project_id}/github/{github_installation_reference}/repository/{github_repository_reference}/cache:
    parameters:
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/github_installation_reference'
      - $ref: '#/components/parameters/github_repository_reference'
    get:
      operationId: getGithubCacheEntries
      summary: List all cache entries for a GitHub repository
      responses:
        '200':
          $ref: '#/components/responses/GithubCacheEntries'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - GitHub
    delete:
      operationId: deleteAllGithubCacheEntries
      summary: Delete all cache entries for a GitHub repository
      responses:
        '204':
          $ref: '#/components/responses/Delete'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - GitHub
  /project/{project_id}/github/{github_installation_reference}/repository/{github_repository_reference}/cache/{github_cache_entry_id}:
    parameters:
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/github_installation_reference'
      - $ref: '#/components/parameters/github_repository_reference'
      - $ref: '#/components/parameters/github_cache_entry_id'
    get:
      operationId: getGithubCacheEntry
      summary: Get cache entry details
      responses:
        '200':
          $ref: '#/components/responses/GithubCacheEntry'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - GitHub
    delete:
      operationId: deleteGithubCacheEntry
      summary: Delete a cache entry
      responses:
        '204':
          $ref: '#/components/responses/Delete'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - GitHub
  /project/{project_id}/inference-api-key:
    parameters:
      - $ref: '#/components/parameters/project_id'
    get:
      operationId: getInferenceApiKeys
      summary: List all inference API keys
      responses:
        '200':
          $ref: '#/components/responses/InferenceApiKeys'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Inference Api Key
    post:
      operationId: createInferenceApiKey
      summary: Create a new inference API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
              additionalProperties: false
      responses:
        '200':
          $ref: '#/components/responses/InferenceApiKey'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Inference Api Key
  /project/{project_id}/inference-api-key/{inference_api_key_id}:
    parameters:
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/inference_api_key_id'
    get:
      operationId: getInferenceApiKey
      summary: Get inference API key details
      responses:
        '200':
          $ref: '#/components/responses/InferenceApiKey'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Inference Api Key
    delete:
      operationId: deleteInferenceApiKey
      summary: Delete a specific inference API key
      responses:
        '204':
          $ref: '#/components/responses/Delete'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Inference Api Key
  /project/{project_id}/inference-endpoint:
    parameters:
      - $ref: '#/components/parameters/project_id'
    get:
      operationId: listInferenceEndpoints
      summary: List all inference endpoints
      responses:
        '200':
          $ref: '#/components/responses/InferenceEndpoints'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Inference Endpoint
  /project/{project_id}/kubernetes-cluster:
    get:
      operationId: listProjectKubernetesClusters
      summary: List all kubernetes clusters
      parameters:
        - $ref: '#/components/parameters/project_id'
        - $ref: '#/components/parameters/start_after'
        - $ref: '#/components/parameters/page_size'
        - $ref: '#/components/parameters/order_column'
      responses:
        '200':
          $ref: '#/components/responses/KubernetesClusters'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Kubernetes Cluster
  /project/{project_id}/load-balancer:
    get:
      operationId: listLoadBalancers
      summary: List all load balancers
      parameters:
        - $ref: '#/components/parameters/project_id'
        - $ref: '#/components/parameters/start_after'
        - $ref: '#/components/parameters/page_size'
        - $ref: '#/components/parameters/order_column'
      responses:
        '200':
          $ref: '#/components/responses/LoadBalancers'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Load Balancer
  /project/{project_id}/location/{location}/firewall:
    parameters:
      - $ref: '#/components/parameters/location'
      - $ref: '#/components/parameters/project_id'
    get:
      operationId: getLocationFirewall
      summary: List firewalls in a location
      responses:
        '200':
          $ref: '#/components/responses/Firewalls'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Firewall
  /project/{project_id}/location/{location}/firewall/{firewall_reference}:
    parameters:
      - $ref: '#/components/parameters/location'
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/firewall_reference'
    delete:
      operationId: deleteLocationFirewall
      summary: Delete a firewall
      responses:
        '204':
          $ref: '#/components/responses/Delete'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Firewall
    get:
      operationId: getLocationFirewallDetails
      summary: Get firewall details
      responses:
        '200':
          $ref: '#/components/responses/FirewallDetailed'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Firewall
    post:
      operationId: createLocationFirewall
      summary: Create a new firewall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  description: Description of the firewall
                  type: string
                  default: ''
              additionalProperties: false
      responses:
        '200':
          $ref: '#/components/responses/Firewall'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Firewall
    patch:
      operationId: updateFirewall
      summary: Update a firewall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  description: New description for firewall
                  type: string
                  example: Allows HTTPS from anywhere
              additionalProperties: false
              required:
                - description
      responses:
        '200':
          $ref: '#/components/responses/Firewall'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Firewall
  /project/{project_id}/location/{location}/firewall/{firewall_reference}/attach-subnet:
    parameters:
      - $ref: '#/components/parameters/location'
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/firewall_reference'
    post:
      operationId: actionLocationFirewallAttachSubnet
      summary: Attach a subnet to firewall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                private_subnet_id:
                  description: ID of the private subnet to attach
                  type: string
                  example: pskkmx0f2vke4h36nk9cm8v8q0
                  writeOnly: true
              additionalProperties: false
              required:
                - private_subnet_id
      responses:
        '200':
          $ref: '#/components/responses/FirewallDetailed'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Firewall
  /project/{project_id}/location/{location}/firewall/{firewall_reference}/detach-subnet:
    parameters:
      - $ref: '#/components/parameters/location'
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/firewall_reference'
    post:
      operationId: actionLocationFirewallDetachSubnet
      summary: Detach a subnet from firewall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                private_subnet_id:
                  description: ID of the private subnet to detach
                  type: string
                  example: pskkmx0f2vke4h36nk9cm8v8q0
                  writeOnly: true
              additionalProperties: false
              required:
                - private_subnet_id
      responses:
        '200':
          $ref: '#/components/responses/FirewallDetailed'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Firewall
  /project/{project_id}/location/{location}/firewall/{firewall_reference}/firewall-rule:
    parameters:
      - $ref: '#/components/parameters/firewall_reference'
      - $ref: '#/components/parameters/location'
      - $ref: '#/components/parameters/project_id'
    post:
      operationId: createLocationFirewallRule
      summary: Create a new firewall rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cidr:
                  description: CIDR or private subnet id or name to allow
                  type: string
                  example: 0.0.0.0/0
                firewall_id:
                  description: Deprecated and ignored; the rule is added to the firewall in the path.
                  type: string
                  deprecated: true
                  x-deprecated:
                    since: 2026-11-02
                    removed-in: 2
                port_range:
                  description: Port or port range to allow, such as 443 or 8000..8080
                  type: string
                  format: port-range
                  default: 0..65535
                  pattern: ^\d+(\.\.\d+)?$
                protocol:
                  description: Protocol to allow (tcp or udp)
                  type: string
                  default: tcp
                description:
                  description: Description to use for the firewall rule
                  type: string
                  default: ''
                project_id:
                  description: Deprecated and ignored; the project comes from the path.
                  type: string
                  deprecated: true
                  x-deprecated:
                    since: 2026-11-02
                    removed-in: 2
              additionalProperties: false
              required:
                - cidr
      responses:
        '200':
          $ref: '#/components/responses/FirewallRuleOrRules'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Firewall Rule
  /project/{project_id}/location/{location}/firewall/{firewall_reference}/firewall-rule/{firewall_rule_id}:
    parameters:
      - $ref: '#/components/parameters/location'
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/firewall_reference'
      - $ref: '#/components/parameters/firewall_rule_id'
    delete:
      operationId: deleteLocationFirewallFirewallRule
      summary: Delete a firewall rule
      responses:
        '204':
          $ref: '#/components/responses/Delete'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Firewall Rule
    get:
      operationId: getLocationFirewallFirewallRuleDetails
      summary: Get firewall rule details
      responses:
        '200':
          $ref: '#/components/responses/FirewallRule'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Firewall Rule
    patch:
      operationId: modifyFirewallRule
      summary: Modify a firewall rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cidr:
                  description: CIDR of the firewall rule
                  type: string
                  format: cidr
                port_range:
                  description: Port or port range of the firewall rule, such as 443 or 8000..8080
                  type: string
                  format: port-range
                  pattern: ^\d+(\.\.\d+)?$
                protocol:
                  description: Protocol of the firewall rule (tcp or udp)
                  type: string
                description:
                  description: Description of the firewall rule
                  type: string
              additionalProperties: false
              minProperties: 1
      responses:
        '200':
          $ref: '#/components/responses/FirewallRule'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Firewall Rule
  /project/{project_id}/location/{location}/firewall/{firewall_reference}/rename:
    parameters:
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/location'
      - $ref: '#/components/parameters/firewall_reference'
    post:
      operationId: renameFirewall
      summary: Rename a firewall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: New name for firewall
                  type: string
                  example: my-firewall
              additionalProperties: false
              required:
                - name
      responses:
        '200':
          $ref: '#/components/responses/Firewall'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Firewall
  /project/{project_id}/location/{location}/kubernetes-cluster:
    get:
      operationId: listLocationKubernetesClusters
      summary: List kubernetes clusters in a location
      parameters:
        - $ref: '#/components/parameters/location'
        - $ref: '#/components/parameters/project_id'
        - $ref: '#/components/parameters/start_after'
        - $ref: '#/components/parameters/page_size'
        - $ref: '#/components/parameters/order_column'
      responses:
        '200':
          $ref: '#/components/responses/KubernetesClusters'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Kubernetes Cluster
  /project/{project_id}/location/{location}/kubernetes-cluster/{kubernetes_cluster_reference}:
    parameters:
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/location'
    delete:
      operationId: deleteKubernetesCluster
      summary: Delete a kubernetes cluster
      parameters:
        - $ref: '#/components/parameters/kubernetes_cluster_reference'
      responses:
        '204':
          $ref: '#/components/responses/Delete'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Kubernetes Cluster
    get:
      operationId: getKubernetesClusterDetails
      summary: Get kubernetes cluster details
      parameters:
        - $ref: '#/components/parameters/kubernetes_cluster_reference'
      responses:
        '200':
          $ref: '#/components/responses/KubernetesCluster'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Kubernetes Cluster
    post:
      operationId: createKubernetesCluster
      summary: Create a new kubernetes cluster
      parameters:
        - $ref: '#/components/parameters/kubernetes_cluster_new_name'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  description: Version of the kubernetes cluster
                  type: string
                worker_size:
                  description: Deprecated; create a nodepool instead. Size of each worker VM in a default nodepool, which the cluster gets only if this is given.
                  type: string
                  deprecated: true
                  x-deprecated:
                    since: 2026-11-02
                    removed-in: 3
                    use:
                      - createKubernetesNodepool
                cp_nodes:
                  description: Deprecated; send cp_node_count.
                  type: integer
                  deprecated: true
                  x-deprecated:
                    since: 2026-11-02
                    removed-in: 2
                    renamed-to: cp_node_count
                cp_node_count:
                  description: Number of control plane nodes
                  type: integer
                worker_nodes:
                  description: Deprecated; create a nodepool instead. Number of worker nodes in the default nodepool, 1 by default; it is refused without worker_size.
                  type: integer
                  deprecated: true
                  x-deprecated:
                    since: 2026-11-02
                    removed-in: 3
                    use:
                      - createKubernetesNodepool
              additionalProperties: false
              required:
                - version
      responses:
        '200':
          $ref: '#/components/responses/KubernetesCluster'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Kubernetes Cluster
  /project/{project_id}/location/{location}/kubernetes-cluster/{kubernetes_cluster_reference}/kubeconfig:
    parameters:
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/location'
      - $ref: '#/components/parameters/kubernetes_cluster_reference'
    get:
      operationId: getKubernetesKubeconfigFile
      summary: Get kubeconfig file
      responses:
        '200':
          $ref: '#/components/responses/Kubeconfig'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Kubernetes Cluster
  /project/{project_id}/location/{location}/kubernetes-cluster/{kubernetes_cluster_reference}/metrics:
    parameters:
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/location'
      - $ref: '#/components/parameters/kubernetes_cluster_reference'
    get:
      operationId: getKubernetesClusterMetrics
      summary: Get Kubernetes cluster metrics
      parameters:
        - name: start
          in: query
          description: Start time for metrics query (rfc3339 format)
          required: false
          schema:
            type: string
            example: 2025-05-12T11:57:24+00:00
            default: now-30m
        - name: end
          in: query
          description: End time for metrics query (rfc3339 format)
          required: false
          schema:
            type: string
            example: 2025-05-12T11:27:24+00:00
            default: now
        - name: key
          in: query
          description: Key of the specific metric to retrieve
          required: false
          schema:
            type: string
            example: cpu_usage
      responses:
        '200':
          $ref: '#/components/responses/KubernetesClusterMetrics'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Kubernetes Cluster
  /project/{project_id}/location/{location}/kubernetes-cluster/{kubernetes_cluster_reference}/node/{kubernetes_node_name}/retire:
    parameters:
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/location'
      - $ref: '#/components/parameters/kubernetes_cluster_reference'
      - $ref: '#/components/parameters/kubernetes_node_name'
    post:
      operationId: retireKubernetesNode
      summary: Retire a worker node from a kubernetes cluster
      responses:
        '200':
          $ref: '#/components/responses/KubernetesNodepool'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Kubernetes Cluster
  /project/{project_id}/location/{location}/kubernetes-cluster/{kubernetes_cluster_reference}/nodepool:
    parameters:
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/location'
      - $ref: '#/components/parameters/kubernetes_cluster_reference'
    post:
      operationId: createKubernetesNodepool
      summary: Create a new kubernetes nodepool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: Name of the nodepool
                  type: string
                node_count:
                  description: Number of worker nodes in the nodepool
                  type: integer
                node_size:
                  description: Size of each worker node
                  type: string
                version:
                  description: Kubernetes version of the nodepool. Since a nodepool is always created at its cluster's version, this must be the cluster's version.
                  type: string
              additionalProperties: false
              required:
                - name
                - node_count
                - node_size
      responses:
        '200':
          $ref: '#/components/responses/KubernetesNodepool'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Kubernetes Cluster
  /project/{project_id}/location/{location}/kubernetes-cluster/{kubernetes_cluster_reference}/nodepool/{kubernetes_nodepool_reference}:
    parameters:
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/location'
      - $ref: '#/components/parameters/kubernetes_cluster_reference'
      - $ref: '#/components/parameters/kubernetes_nodepool_reference'
    delete:
      operationId: deleteKubernetesNodepool
      summary: Delete a kubernetes nodepool
      responses:
        '204':
          $ref: '#/components/responses/Delete'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Kubernetes Cluster
    get:
      operationId: getKubernetesNodepoolDetails
      summary: Get kubernetes nodepool details
      responses:
        '200':
          $ref: '#/components/responses/KubernetesNodepool'
        default:
          $ref: '#/components/responses/Error'
      tags:
        - Kubernetes Cluster
