          type: integer
          readOnly: true
        size:
          description: Size of the underlying VM last requested by create or update
          type: string
        storage_size:
          description: Storage size in GiB last requested by create or update
          type: integer
        version:
          description: Current Postgres version
          type: string
          enum:
