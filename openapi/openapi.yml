          readOnly: true
        id:
          description: ID of the Postgres database
          type: string
          example: pgn30gjk1d1e2jj34v9x0dq4rp
          pattern: ^pg[0-9a-hj-km-np-tv-z]{24}$
          readOnly: true
        location:
          description: Location of the Postgres database
          type: string
          readOnly: true
        name:
          description: Name of the Postgres database
          type: string
        state:
          description: State of the Postgres database
          type: string
          enum:
            - creating
            - running
            - restarting
            - restoring_backup
            - replaying_wal
            - finalizing_restore
            - unavailable
            - deleting
          readOnly: true
          x-lifecycle:
            pending:
              - creating
              - restarting
              - restoring_backup
              - replaying_wal
              - finalizing_restore
              - deleting
        storage_size_gib:
          description: Storage size in GiB
