    page_size:
      description: Pagination - Page size
      in: query
      name: page_size
      required: false
      schema:
        type: integer
        default: 10
    postgres_database_reference:
      description: Postgres database ID or name
      examples:
        id:
          value: pgn30gjk1d1e2jj34v9x0dq4rp
        name:
          value: postgres-database-name
      in: path
      name: postgres_database_reference
      required: true
      schema:
        $ref: '#/components/schemas/Reference'
    private_link_service_reference:
      description: Private link service ID or name
      examples:
        id:
          value: pn45xss5619a5gx2k7xz482n0s
        name:
          value: private-link-service-name
      in: path
      name: private_link_service_reference
