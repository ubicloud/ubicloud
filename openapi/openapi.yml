                  private_subnet_id:
                    description: ID of the VM's private subnet
                    type: string
                    example: pskkmx0f2vke4h36nk9cm8v8q0
                    nullable: true
                    pattern: ^ps[0-9a-hj-km-np-tv-z]{24}$
                  subnet:
                    description: Name of the VM's private subnet
                    type: string
                    nullable: true
                    readOnly: true
                  gpu:
                    description: Number and model of the GPUs attached to the VM, such as "1x NVIDIA A100 80GB PCIe"; null if it has none
                    type: string
                    nullable: true
                    readOnly: true
                  gpu_count:
                    description: Number of GPUs attached to the VM; 0 until the VM is placed on a host
                    type: integer
