---
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage/state:
    directory: "/var/lib/otelcol-contrib/state"
    create_directory: true
    compaction:
      directory: "/tmp/otelcol"
      on_start: true
      on_rebound: true
      rebound_needed_threshold_mib: 1024
      rebound_trigger_threshold_mib: 100
receivers:
  filelog/pglog:
    include:
    - "/dat/17/data/pg_log/postgresql-*.log"
    start_at: end
    storage: file_storage/state
    operators:
    - type: regex_parser
      regex: "^(?P<timestamp>\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}\\.\\d{3} \\w+)
        \\[(?P<pid>\\d+):\\d+\\] \\([^,]*,[^)]*\\): host=(?P<remote_host_port>[^,]*),db=(?P<dbname>[^,]*),user=(?P<user>[^,]*),app=(?P<app_name>.*?),client=(?P<remote_host>\\S*)
        (?P<error_severity>[A-Z0-9]+):\\s+(?P<message>.*)"
      on_error: send_quiet
      severity:
        parse_from: attributes.error_severity
        preset: none
        mapping:
          fatal:
          - FATAL
          - PANIC
          error: ERROR
          warn: WARNING
          info:
          - NOTICE
          - INFO
          - LOG
          - DETAIL
          - HINT
          - QUERY
          - CONTEXT
          - LOCATION
          - STATEMENT
          debug:
          - DEBUG
          - DEBUG1
          - DEBUG2
          - DEBUG3
          - DEBUG4
          - DEBUG5
    - type: time_parser
      parse_from: attributes.timestamp
      layout: 2006-01-02 15:04:05.000 MST
      layout_type: gotime
      if: attributes.timestamp != nil
      on_error: send_quiet
    - type: copy
      from: body
      to: attributes.message
      if: attributes.message == nil
    - type: copy
      from: attributes.message
      to: body
    - type: remove
      field: attributes.error_severity
      if: attributes.error_severity != nil
    - type: add
      field: attributes.stream
      value: postgres
    - type: add
      field: attributes.instance
      value: pg1abc2def3
    - type: add
      field: attributes.server_role
      value: primary
    - type: add
      field: attributes.hostname
      value: pg1abc2def3
    - type: add
      field: attributes.resource_name
      value: my-pg-db
    - type: add
      field: attributes.resource_id
      value: pg9x8y7z6w
    - type: remove
      field: attributes.timestamp
      if: attributes.timestamp != nil
    - type: add
      field: attributes.dbname
      value: ''
      if: attributes.dbname == nil
    - type: add
      field: attributes.user
      value: ''
      if: attributes.user == nil
    - type: add
      field: attributes.remote_host_port
      value: ''
      if: attributes.remote_host_port == nil
    - type: retain
      fields:
      - body
      - attributes.message
      - attributes.stream
      - attributes.instance
      - attributes.server_role
      - attributes.hostname
      - attributes.resource_name
      - attributes.resource_id
      - attributes.pid
      - attributes.dbname
      - attributes.user
      - attributes.app_name
      - attributes.remote_host
      - attributes.remote_host_port
  journald:
    storage: file_storage/state
    units:
    - system-postgresql.slice
    - system-pgbouncer.slice
    - upgrade_postgres.service
    operators:
    - id: parse_journal_timestamp
      type: time_parser
      parse_from: body["__REALTIME_TIMESTAMP"]
      layout_type: epoch
      layout: us
      on_error: send_quiet
    - id: filter_units
      type: router
      routes:
      - output: mark_postgres_stream
        expr: body["_SYSTEMD_UNIT"] != nil && body["_SYSTEMD_UNIT"] startsWith "postgresql@"
      - output: mark_pgbouncer_stream
        expr: body["_SYSTEMD_UNIT"] != nil && body["_SYSTEMD_UNIT"] startsWith "pgbouncer@"
      - output: mark_upgrade_stream
        expr: body["_SYSTEMD_UNIT"] != nil && body["_SYSTEMD_UNIT"] startsWith "upgrade_postgres"
    - id: mark_postgres_stream
      type: add
      field: attributes.stream
      value: postgres
      output: set_common_fields
    - id: mark_pgbouncer_stream
      type: add
      field: attributes.stream
      value: pgbouncer
      output: set_common_fields
    - id: mark_upgrade_stream
      type: add
      field: attributes.stream
      value: upgrade
      output: set_common_fields
    - id: set_common_fields
      type: add
      field: attributes.instance
      value: pg1abc2def3
    - type: add
      field: attributes.server_role
      value: primary
    - type: add
      field: attributes.hostname
      value: pg1abc2def3
    - type: add
      field: attributes.resource_name
      value: my-pg-db
    - type: add
      field: attributes.resource_id
      value: pg9x8y7z6w
    - type: move
      from: body
      to: attributes.journald
    - type: copy
      from: attributes.journald["MESSAGE"]
      to: attributes.message
    - type: move
      from: attributes.journald["MESSAGE"]
      to: body
    - type: flatten
      field: attributes.journald
    - type: move
      from: attributes["_PID"]
      to: attributes.pid
    - type: severity_parser
      parse_from: attributes["PRIORITY"]
      preset: none
      mapping:
        fatal:
        - '0'
        - '1'
        - '2'
        error: '3'
        warn: '4'
        info:
        - '5'
        - '6'
        debug: '7'
    - type: retain
      fields:
      - body
      - attributes.message
      - attributes.stream
      - attributes.instance
      - attributes.server_role
      - attributes.hostname
      - attributes.resource_name
      - attributes.resource_id
      - attributes.pid
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    timeout: 2s
    send_batch_max_size: 10240
exporters:
  nop:
service:
  extensions:
  - health_check
  - file_storage/state
  telemetry:
    logs:
      level: warn
    metrics:
      level: basic
      readers:
      - pull:
          exporter:
            prometheus:
              host: 127.0.0.1
              port: 8888
  pipelines:
    logs/pglog/noop:
      receivers:
      - filelog/pglog
      processors:
      - memory_limiter
      - batch
      exporters:
      - nop
    logs/journal/noop:
      receivers:
      - journald
      processors:
      - memory_limiter
      - batch
      exporters:
      - nop
