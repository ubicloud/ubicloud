name: 'Setup Clover'

inputs:
  setup-node:
    description: 'Set up Node.js and install npm dependencies'
    required: false
    type: boolean
    default: false

runs:
  using: "composite"
  steps:
    - name: Start PostgreSQL setup in the background
      shell: bash
      run: |
        (PS4='+ $(date +%T.%3N) ' "$GITHUB_ACTION_PATH/setup-postgres.sh" > "$RUNNER_TEMP/setup-postgres.log" 2>&1; echo $? > "$RUNNER_TEMP/setup-postgres.status") &

    - name: Set up Ruby
      uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
      with:
        ruby-version: mise.toml
        bundler-cache: true

    - name: Set up Node.js
      if: ${{ inputs.setup-node == 'true' }}
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: "package.json"
        cache: "npm"

    - name: Install node packages
      if: ${{ inputs.setup-node == 'true' }}
      shell: bash
      run: npm ci

    - name: Create .env.rb file
      shell: bash
      run: "bundle exec rake overwrite_envrb && echo '$stdout.sync = true' >> .env.rb"

    - name: Wait for PostgreSQL setup
      shell: bash
      run: |
        until [ -f "$RUNNER_TEMP/setup-postgres.status" ]; do sleep 1; done
        cat "$RUNNER_TEMP/setup-postgres.log"
        exit "$(cat "$RUNNER_TEMP/setup-postgres.status")"

    - name: Setup clover database
      shell: bash
      run: |
        createuser -U postgres clover
        createuser -U postgres clover_password
        bundle exec rake setup_database\[test,true\]
