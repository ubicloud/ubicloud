name: 'Setup Clover'

inputs:
  setup-node:
    description: 'Set up Node.js and install npm dependencies'
    required: false
    type: boolean
    default: false

runs:
  using: "composite"
  steps:
    - name: Start PostgreSQL setup in the background
      shell: bash
      run: |
        # Write the status atomically, so the wait step never reads an empty file
        (PS4='+ $(date +%T.%3N) ' "$GITHUB_ACTION_PATH/setup-postgres.sh" > "$RUNNER_TEMP/setup-postgres.log" 2>&1; echo $? > "$RUNNER_TEMP/setup-postgres.status.tmp"; mv "$RUNNER_TEMP/setup-postgres.status.tmp" "$RUNNER_TEMP/setup-postgres.status") &

    - name: Set up Ruby
      uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
      with:
        ruby-version: mise.toml
        bundler-cache: true

    - name: Set up Node.js
      if: ${{ inputs.setup-node == 'true' }}
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: "package.json"
        cache: "npm"

    - name: Install node packages
      if: ${{ inputs.setup-node == 'true' }}
      shell: bash
      run: npm ci

    - name: Create .env.rb file
      shell: bash
      run: "bundle exec rake overwrite_envrb && echo '$stdout.sync = true' >> .env.rb"

    - name: Wait for PostgreSQL setup
      shell: bash
      run: |
        # The setup usually takes less than a minute. If it hangs, fail with
        # enough state to see where, instead of waiting for the job timeout.
        for _ in $(seq 300); do
          [ -f "$RUNNER_TEMP/setup-postgres.status" ] && break
          sleep 1
        done
        cat "$RUNNER_TEMP/setup-postgres.log"
        if [ ! -f "$RUNNER_TEMP/setup-postgres.status" ]; then
          echo "::error::PostgreSQL setup did not finish in 5 minutes"
          set -x
          ps -eo pid,ppid,etime,stat,args --forest
          systemctl is-system-running || true
          systemctl list-jobs --no-pager
          systemctl status 'postgresql*' --no-pager || true
          sudo journalctl -b --no-pager -u 'postgresql*' -u apt-daily.service -u apt-daily-upgrade.service -u unattended-upgrades.service | tail -n 200
          exit 1
        fi
        exit "$(cat "$RUNNER_TEMP/setup-postgres.status")"

    - name: Setup clover database
      shell: bash
      run: |
        createuser -U postgres clover
        createuser -U postgres clover_password
        bundle exec rake setup_database\[test,true\]
