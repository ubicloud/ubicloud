name: kubernetes/csi CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.tool-versions'
      - 'kubernetes/csi/**'
      - '.github/workflows/kubernetes-csi-ci.yml'
  pull_request:
    paths:
      - '.tool-versions'
      - 'kubernetes/csi/**'
      - '.github/workflows/kubernetes-csi-ci.yml'

jobs:
  kubernetes-csi-ci:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubicloud-standard-2, ubicloud-standard-2-arm]
    name: Ruby CI - ${{matrix.runs-on}}
    runs-on: ${{matrix.runs-on}}
    timeout-minutes: 25

    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Ruby for CSI gems
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
      env:
        BUNDLE_GEMFILE: kubernetes/csi/Gemfile
      with:
        ruby-version: mise.toml
        bundler-cache: true

    - name: Run CSI tests
      run: rake csi_spec
